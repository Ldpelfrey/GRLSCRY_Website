<!doctype html>
<!-- Share-image layout (1200x630). Rendered by tools/render_og.py; not deployed. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,300&display=block" rel="stylesheet">
<style>
  :root { --sage: #D7EFC2; --pink: #FF69B4; --black: #0e0e0e; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: var(--black); overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .plate {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: 60% 40%; /* the DJ at the decks sits right of centre */ opacity: .5; filter: blur(1.5px) saturate(1.1);
  }
  /* same scrim + pink glow as the site hero */
  .scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 60% at 50% 48%, rgba(255,105,180,.16), transparent 70%),
      linear-gradient(90deg, rgba(14,14,14,.6) 0%, rgba(14,14,14,.2) 50%, rgba(14,14,14,.6) 100%),
      linear-gradient(180deg, rgba(14,14,14,.45) 0%, rgba(14,14,14,0) 35%, rgba(14,14,14,.7) 100%);
  }
  .label {
    position: absolute; left: 0; right: 0; top: 60px; justify-content: center;
    font: 500 15px/1 'IBM Plex Mono', monospace; letter-spacing: .22em; text-transform: uppercase;
    color: var(--sage); display: flex; align-items: center; gap: 14px;
  }
  .label i { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); display: block; }
  .logo {
    position: absolute; left: 50%; top: 108px; width: 640px; height: auto; transform: translateX(-50%);
    filter: drop-shadow(0 26px 50px rgba(255,105,180,.34)) drop-shadow(0 4px 3px rgba(0,0,0,.5));
  }
  .tag {
    position: absolute; left: 0; right: 0; top: 488px; text-align: center;
    font: italic 300 24px/1 'IBM Plex Mono', monospace; color: var(--pink); letter-spacing: .01em;
  }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 38px; text-align: center;
    font: 400 13px/1 'IBM Plex Mono', monospace; letter-spacing: .24em; color: rgba(215,239,194,.5);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="plate" src="../images/hero/plate-poster.jpg" alt="">
    <div class="scrim"></div>
    <div class="label"><i></i>DJ / Producer — Scottsdale, AZ</div>
    <img class="logo" src="../images/brand/grlscry-logo-1800.webp" alt="">
    <div class="tag">Dark · High Energy · Late Night</div>
    <div class="foot">GRLSCRY.COM — MUSIC · BOOKING · MERCH</div>
  </div>
</body>
</html>
